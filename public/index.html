<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Bostezos</title>
    <style>
        /* Estilos generales y paleta de colores nocturna */
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --card-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Encabezado */
        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Botón Principal y Controles */
        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
        }

        #yawn-btn {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #334155;
            border-radius: 50%;
            width: 160px;
            height: 160px;
            font-size: 5rem;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #yawn-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(59, 130, 246, 0.3);
            border-color: var(--primary);
        }

        #yawn-btn:active {
            transform: translateY(2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .total-counter {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #94a3b8;
        }

        .total-counter span {
            font-weight: bold;
            color: white;
            font-size: 1.5rem;
        }

        #reset-btn {
            margin-top: 15px;
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        #reset-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        /* Sección de Filtro por Fecha */
        .filter-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-section label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        input[type="date"] {
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: inherit;
            color-scheme: dark;
            flex-grow: 1;
        }

        #clear-filter-btn {
            background: #334155;
            color: white;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        #clear-filter-btn:hover {
            background: #475569;
        }

        /* Historial agrupado por días */
        .history-container {
            width: 100%;
        }

        .day-group {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px 20px;
            margin-bottom: 15px;
        }

        .day-title {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #60a5fa;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .time-badge {
            display: inline-block;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            margin: 5px;
            font-family: monospace;
            font-size: 0.95rem;
            border: 1px solid #475569;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Contador de Bostezos</h1>
            <p>Registra cada vez que el sueño te gane</p>
        </header>

        <div class="button-container">
            <button id="yawn-btn" title="¡Haz clic si bostezaste!">🥱</button>
            <div class="total-counter">Total histórico: <span id="total-count">0</span></div>
            <button id="reset-btn">🗑️ Reiniciar contador</button>
        </div>

        <div class="filter-section">
            <label for="date-filter">Buscar registros por fecha específica:</label>
            <div class="filter-controls">
                <input type="date" id="date-filter">
                <button id="clear-filter-btn">Ver todos</button>
            </div>
        </div>

        <div class="history-container" id="history-container">
            <!-- El contenido se generará con JavaScript -->
        </div>
    </div>

    <script>
        // Elementos del DOM
        const yawnBtn = document.getElementById('yawn-btn');
        const resetBtn = document.getElementById('reset-btn');
        const historyContainer = document.getElementById('history-container');
        const totalCountEl = document.getElementById('total-count');
        const dateFilter = document.getElementById('date-filter');
        const clearFilterBtn = document.getElementById('clear-filter-btn');

        // Instanciar el efecto de sonido (apunta a la carpeta /sound)
        const yawnSound = new Audio('sound/claro_que_yes.mp3');

        // Cargar registros de localStorage
        let yawnRecords = JSON.parse(localStorage.getItem('bostezos_db')) || [];

        // Función para renderizar la interfaz
        function renderHistory() {
            historyContainer.innerHTML = '';
            
            const filterValue = dateFilter.value;
            let recordsToRender = yawnRecords;

            if (filterValue) {
                recordsToRender = yawnRecords.filter(record => {
                    const d = new Date(record.timestamp);
                    const year = d.getFullYear();
                    const month = String(d.getMonth() + 1).padStart(2, '0');
                    const day = String(d.getDate()).padStart(2, '0');
                    const recordIsoDate = `${year}-${month}-${day}`;
                    
                    return recordIsoDate === filterValue;
                });
            }

            totalCountEl.textContent = yawnRecords.length;

            if (recordsToRender.length === 0) {
                const message = filterValue 
                    ? 'No hay bostezos registrados en esta fecha.' 
                    : 'Aún no hay bostezos registrados. ¡Sé el primero!';
                historyContainer.innerHTML = `<p class="empty-state">${message}</p>`;
                return;
            }

            const groupedData = {};
            
            recordsToRender.forEach(record => {
                if (!groupedData[record.date]) {
                    groupedData[record.date] = [];
                }
                groupedData[record.date].push(record.time);
            });

            const sortedDates = Object.keys(groupedData);

            for (const date of sortedDates) {
                const times = groupedData[date];
                
                const dayGroup = document.createElement('div');
                dayGroup.className = 'day-group';
                
                dayGroup.innerHTML = `
                    <h3 class="day-title">
                        <span>📅 ${date}</span>
                        <span style="color: #94a3b8; font-size: 0.9rem;">${times.length} bostezos</span>
                    </h3>
                    <div class="times-container">
                        ${times.map(time => `<span class="time-badge">🕒 ${time}</span>`).join('')}
                    </div>
                `;
                
                historyContainer.appendChild(dayGroup);
            }
        }

        // Evento: Registrar nuevo bostezo y reproducir sonido
        yawnBtn.addEventListener('click', () => {
            // Reproducir el sonido
            yawnSound.currentTime = 0; // Reinicia el audio por si hacen clics rápidos
            yawnSound.play().catch(error => {
                console.log('El navegador bloqueó la reproducción automática o no encontró el archivo:', error);
            });

            const now = new Date();
            const dateStr = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const timeStr = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second:'2-digit' });

            const newRecord = {
                date: dateStr.charAt(0).toUpperCase() + dateStr.slice(1),
                time: timeStr,
                timestamp: now.getTime()
            };

            yawnRecords.unshift(newRecord);
            localStorage.setItem('bostezos_db', JSON.stringify(yawnRecords));
            
            dateFilter.value = ''; 
            renderHistory();
        });

        // Evento: Reiniciar contador
        resetBtn.addEventListener('click', () => {
            if (confirm('¿Estás seguro de que quieres borrar todo tu historial de bostezos?')) {
                yawnRecords = [];
                localStorage.removeItem('bostezos_db');
                renderHistory();
            }
        });

        dateFilter.addEventListener('change', renderHistory);

        clearFilterBtn.addEventListener('click', () => {
            dateFilter.value = '';
            renderHistory();
        });

        // Renderizado inicial
        renderHistory();
    </script>
</body>
</html>
